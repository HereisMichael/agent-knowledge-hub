services:
  volume-init:
    build: ./backend
    user: root
    command: >-
      sh -c "mkdir -p /app/data /app/privacy-ledger &&
      chown -R app:app /app/data /app/privacy-ledger"
    volumes:
      - ./backend/data:/app/data
      - ./privacy-ledger:/app/privacy-ledger

  api:
    build: ./backend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./knowledge:/app/knowledge
      - ./content:/app/content
      - ./labs:/app/labs
      - ./backend/data:/app/data
      - ./privacy-ledger:/app/privacy-ledger
    working_dir: /app
    env_file:
      - path: ./backend/.env.example
      - path: ./backend/.env
        required: false
    environment:
      KNOWLEDGE_PATH: /app/knowledge
      CONTENT_ROOT: /app/content
      PROJECT_ROOT: /app
      CONTENT_SCHEDULER_ENABLED: "false"
      PRIVACY_LEDGER_PATH: /app/privacy-ledger/account-deletions.db
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 45s

  scheduler:
    build: ./backend
    restart: unless-stopped
    init: true
    command: python -m app.scheduler.worker
    volumes:
      - ./knowledge:/app/knowledge
      - ./content:/app/content
      - ./labs:/app/labs
      - ./backend/data:/app/data
      - ./privacy-ledger:/app/privacy-ledger
    working_dir: /app
    env_file:
      - path: ./backend/.env.example
      - path: ./backend/.env
        required: false
    environment:
      KNOWLEDGE_PATH: /app/knowledge
      CONTENT_ROOT: /app/content
      PROJECT_ROOT: /app
      CONTENT_SCHEDULER_ENABLED: "true"
      PRIVACY_LEDGER_PATH: /app/privacy-ledger/account-deletions.db
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    init: true
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
