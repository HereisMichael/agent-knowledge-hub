name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Test backend
        working-directory: backend
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Validate preserved assets
        run: python -m pytest tests -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build deployment images
        run: docker compose build
      - name: Initialize and verify privacy ledger on Linux
        run: |
          docker compose run --rm --no-deps volume-init
          docker compose run --rm --no-deps api python -m app.privacy.ledger_cli init
          docker compose run --rm --no-deps api python -m app.privacy.ledger_cli verify
      - name: Smoke test API readiness
        run: |
          docker compose up -d api
          timeout 90s bash -c 'until curl --fail http://127.0.0.1:8001/api/health/ready; do sleep 2; done'
      - name: Clean up containers and test volumes
        if: always()
        run: docker compose down --volumes
